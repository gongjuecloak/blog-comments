name: 友链自动合并

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

env:
  TARGET_REPO: gongjuecloak/CloakBlog
  TARGET_BRANCH: master
  FRIENDS_FILE: src/friends.json
  HEALTH_FILE: src/friends_health.json

jobs:
  friend-link:
    if: startsWith(github.event.issue.title, '[友链申请]') || startsWith(github.event.issue.title, '[删除友链]') || startsWith(github.event.issue.title, '[修改友链]')
    runs-on: ubuntu-latest
    steps:
      - name: Python解析Issue表单内容
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python3 << 'PY'
          import re, os
          body = os.environ["ISSUE_BODY"]
          title = os.environ["ISSUE_TITLE"]
          action_type = "add"
          if title.startswith("[删除友链]"):
              action_type = "delete"
          elif title.startswith("[修改友链]"):
              action_type = "edit"
          print(f"====DEBUG==== action_type={action_type}")

          def get_val(label: str):
              pat = re.compile(rf'### {re.escape(label)}\s*\n+(.*?)(?=\n### |\Z)', re.S)
              m = pat.search(body)
              val = ""
              if m:
                  val = m.group(1).strip()
              print(f"====DEBUG==== [{label}] => `{val}`")
              return val

          old_url = ""
          if action_type == "add":
              name = get_val("博客名称")
              url = get_val("博客地址")
              avatar = get_val("头像地址")
              desc = get_val("博客描述")
          elif action_type == "delete":
              name = ""
              url = get_val("需要删除的博客地址（完整URL）")
              avatar = ""
              desc = ""
          else: # edit
              old_url = get_val("原始友链地址（用来定位条目）")
              name = get_val("新博客名称")
              url = get_val("新博客地址")
              avatar = get_val("新头像地址")
              desc = get_val("新博客描述")

          def out(key, val):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf8") as f:
                  f.write(f"{key}<<EOFV\n{val}\nEOFV\n")

          out("action_type", action_type)
          out("old_url", old_url)
          out("name", name)
          out("url", url)
          out("avatar", avatar)
          out("desc", desc)
          PY

      # ====================== 新增友链流程 ======================
      - name: 【新增】校验基础字段 + 探测对方网站连通性
        id: check_site_add
        if: steps.parse.outputs.action_type == 'add'
        env:
          URL: ${{ steps.parse.outputs.url }}
          NAME: ${{ steps.parse.outputs.name }}
        run: |
          skip="false"
          msg=""
          if [[ -z "$NAME" || -z "$URL" ]]; then
            skip="true"
            msg="缺少【博客名称/博客地址】，表单信息不全"
          elif [[ ! "$URL" =~ ^https?:// ]]; then
            skip="true"
            msg="博客地址必须以 http:// 或 https:// 开头"
          else
            echo "正在检测站点: $URL"
            HTTP_CODE=$(curl -L -A "GithubActions Bot/1.0" -m 10 -s -o /dev/null -w "%{http_code}" "$URL")
            if [[ "$HTTP_CODE" != "200" ]]; then
              skip="true"
              msg="站点访问检测失败，HTTP状态码：$HTTP_CODE，请确保网站可正常访问后重新申请"
            fi
          fi
          echo "skip=$skip" >> $GITHUB_OUTPUT
          echo "msg<<EOFV" >> $GITHUB_OUTPUT
          echo "$msg" >> $GITHUB_OUTPUT
          echo "EOFV" >> $GITHUB_OUTPUT

      - name: 检出 CloakBlog 仓库
        if: >
          (steps.parse.outputs.action_type == 'add' && steps.check_site_add.outputs.skip == 'false')
          || steps.parse.outputs.action_type == 'delete'
          || steps.parse.outputs.action_type == 'edit'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.PERSONAL_TOKEN }}
          path: CloakBlog
          ref: ${{ env.TARGET_BRANCH }}

      - name: 【新增】写入友链JSON（查重+追加）
        id: process_add
        if: steps.parse.outputs.action_type == 'add' && steps.check_site_add.outputs.skip == 'false'
        env:
          NAME: ${{ steps.parse.outputs.name }}
          URL: ${{ steps.parse.outputs.url }}
          AVATAR: ${{ steps.parse.outputs.avatar }}
          DESC: ${{ steps.parse.outputs.desc }}
          WORK_PATH: CloakBlog
        run: |
          python3 << 'PYEOF'
          import json, os
          work_dir = os.environ["WORK_PATH"]
          friends_path = os.path.join(work_dir, os.environ["FRIENDS_FILE"])
          health_path = os.path.join(work_dir, os.environ["HEALTH_FILE"])

          name = os.environ.get("NAME", "").strip()
          url = os.environ.get("URL", "").strip()
          avatar = os.environ.get("AVATAR", "").strip()
          desc = os.environ.get("DESC", "").strip()
          skip = False
          skip_msg = ""

          try:
              with open(friends_path, "r", encoding="utf-8") as f:
                  friends = json.load(f)
          except Exception:
              friends = []
          exist_urls = [item.get("url", "").strip() for item in friends]
          if url in exist_urls:
              skip = True
              skip_msg = f"URL {url} 已存在，请勿重复申请友链"
          else:
              friends.append({"name": name, "url": url, "avatar": avatar, "desc": desc})
              with open(friends_path, "w", encoding="utf-8") as f:
                  json.dump(friends, f, ensure_ascii=False, indent=2)
                  f.write("\n")
              try:
                  with open(health_path, "r", encoding="utf-8") as f:
                      health = json.load(f)
              except Exception:
                  health = {}
              health[url] = True
              with open(health_path, "w", encoding="utf-8") as f:
                  json.dump(health, f, ensure_ascii=False, indent=2)
                  f.write("\n")

          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as out:
              out.write(f"skip={skip}\n")
              if skip:
                  out.write(f"skip_msg<<EOFV\n{skip_msg}\nEOFV\n")
          PYEOF

      # ====================== 删除友链流程 ======================
      - name: 【删除】执行移除URL
        id: process_del
        if: steps.parse.outputs.action_type == 'delete'
        env:
          DEL_URL_RAW: ${{ steps.parse.outputs.url }}
          WORK_PATH: CloakBlog
        run: |
          python3 << 'PYEOF'
          import json, os
          work_dir = os.environ["WORK_PATH"]
          friends_path = os.path.join(work_dir, os.environ["FRIENDS_FILE"])
          health_path = os.path.join(work_dir, os.environ["HEALTH_FILE"])
          del_url_input = os.environ["DEL_URL_RAW"].strip()
          print(f"====DELETE DEBUG=== 待删除URL输入: `{del_url_input}`")

          def normalize_url(u: str):
              u = u.strip()
              while u.endswith("/"):
                  u = u[:-1]
              if u.startswith("http://"):
                  u = "https://" + u[7:]
              return u

          target_norm = normalize_url(del_url_input)
          print(f"标准化比对字符串: `{target_norm}`")
          skip = False
          skip_msg = ""

          try:
              with open(friends_path, "r", encoding="utf-8") as f:
                  friends = json.load(f)
          except Exception as e:
              print("读取friends.json异常:", e)
              friends = []

          old_len = len(friends)
          friends_filtered = []
          match_item = None
          for item in friends:
              item_url = item.get("url", "").strip()
              item_norm = normalize_url(item_url)
              if item_norm != target_norm:
                  friends_filtered.append(item)
              else:
                  match_item = item
                  print(f"✅ 匹配成功，库内原始URL：`{item_url}`")

          friends = friends_filtered
          print(f"原友链数量:{old_len} 过滤后:{len(friends)}")

          if len(friends) == old_len:
              skip = True
              skip_msg = f"未匹配到友链地址：{del_url_input}"
          else:
              with open(friends_path, "w", encoding="utf-8") as f:
                  json.dump(friends, f, ensure_ascii=False, indent=2)
                  f.write("\n")
              print("✅ friends.json 已重写")
              if match_item and "url" in match_item:
                  origin_key = match_item["url"]
                  try:
                      with open(health_path, "r", encoding="utf-8") as f:
                          health = json.load(f)
                  except Exception:
                      health = {}
                  if origin_key in health:
                      del health[origin_key]
                      with open(health_path, "w", encoding="utf-8") as f:
                          json.dump(health, f, ensure_ascii=False, indent=2)
                          f.write("\n")
                      print(f"✅ friends_health.json 删除key: {origin_key}")

          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as out:
              out.write(f"skip={skip}\n")
              if skip:
                  out.write(f"skip_msg<<EOFV\n{skip_msg}\nEOFV\n")
          PYEOF

      # ====================== 【新增】修改友链流程 ======================
      - name: 【修改】更新友链信息
        id: process_edit
        if: steps.parse.outputs.action_type == 'edit'
        env:
          OLD_URL_RAW: ${{ steps.parse.outputs.old_url }}
          NEW_NAME: ${{ steps.parse.outputs.name }}
          NEW_URL: ${{ steps.parse.outputs.url }}
          NEW_AVATAR: ${{ steps.parse.outputs.avatar }}
          NEW_DESC: ${{ steps.parse.outputs.desc }}
          WORK_PATH: CloakBlog
        run: |
          python3 << 'PYEOF'
          import json, os
          work_dir = os.environ["WORK_PATH"]
          friends_path = os.path.join(work_dir, os.environ["FRIENDS_FILE"])
          health_path = os.path.join(work_dir, os.environ["HEALTH_FILE"])

          old_url_input = os.environ["OLD_URL_RAW"].strip()
          new_name = os.environ["NEW_NAME"].strip()
          new_url = os.environ["NEW_URL"].strip()
          new_avatar = os.environ["NEW_AVATAR"].strip()
          new_desc = os.environ["NEW_DESC"].strip()

          print(f"====EDIT DEBUG=== 原始URL: `{old_url_input}`")
          print(f"====EDIT DEBUG=== 新URL: `{new_url}`")

          def normalize_url(u: str):
              u = u.strip()
              while u.endswith("/"):
                  u = u[:-1]
              if u.startswith("http://"):
                  u = "https://" + u[7:]
              return u

          target_norm = normalize_url(old_url_input)
          skip = False
          skip_msg = "未找到原始友链，无法修改"
          found = False
          origin_store_url = ""

          try:
              with open(friends_path, "r", encoding="utf-8") as f:
                  friends = json.load(f)
          except Exception:
              friends = []

          for item in friends:
              item_url = item.get("url","").strip()
              item_norm = normalize_url(item_url)
              if item_norm == target_norm:
                  found = True
                  origin_store_url = item_url
                  # 覆盖全部字段
                  item["name"] = new_name
                  item["url"] = new_url
                  item["avatar"] = new_avatar
                  item["desc"] = new_desc
                  break

          if found:
              skip = False
              skip_msg = ""
              # 写入friends.json
              with open(friends_path, "w", encoding="utf-8") as f:
                  json.dump(friends, f, ensure_ascii=False, indent=2)
                  f.write("\n")
              print("✅ friends.json 修改完成")

              # health处理：新旧url不同则删除旧key，新增新key
              try:
                  with open(health_path, "r", encoding="utf-8") as f:
                      health = json.load(f)
              except Exception:
                  health = {}

              if origin_store_url != new_url:
                  if origin_store_url in health:
                      del health[origin_store_url]
                      print(f"✅ 删除旧健康key: {origin_store_url}")
              health[new_url] = True
              with open(health_path, "w", encoding="utf-8") as f:
                  json.dump(health, f, ensure_ascii=False, indent=2)
                  f.write("\n")
              print(f"✅ 更新健康key: {new_url}")

          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as out:
              out.write(f"skip={skip}\n")
              if skip:
                  out.write(f"skip_msg<<EOFV\n{skip_msg}\nEOFV\n")
          PYEOF

      # ====================== 统一提交 ======================
      - name: 提交推送 CloakBlog
        if: >
          (steps.parse.outputs.action_type == 'add' && steps.check_site_add.outputs.skip == 'false' && steps.process_add.outputs.skip == 'false')
          || (steps.parse.outputs.action_type == 'delete' && steps.process_del.outputs.skip == 'false')
          || (steps.parse.outputs.action_type == 'edit' && steps.process_edit.outputs.skip == 'false')
        env:
          ACTION_TYPE: ${{ steps.parse.outputs.action_type }}
          TARGET_URL: ${{ steps.parse.outputs.url }}
          OLD_URL: ${{ steps.parse.outputs.old_url }}
          TARGET_NAME: ${{ steps.parse.outputs.name }}
        run: |
          cd CloakBlog
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.FRIENDS_FILE }} ${{ env.HEALTH_FILE }}

          echo "====git diff 变更预览===="
          git diff --cached
          echo "========================"

          if git diff --cached --quiet; then
            echo "⚠️ 无文件变更，跳过提交"
            exit 0
          fi
          if [[ "$ACTION_TYPE" == "add" ]];then
            git commit -m "feat: 新增友链 - $TARGET_NAME"
          elif [[ "$ACTION_TYPE" == "delete" ]];then
            git commit -m "chore: 删除友链 - $TARGET_URL"
          else
            git commit -m "chore: 修改友链 $OLD_URL → $TARGET_URL"
          fi
          git push origin ${{ env.TARGET_BRANCH }}
          echo "✅ git push 执行完毕"

      # ====================== 统一评论并关闭Issue ======================
      - name: Issue 评论 + 关闭
        uses: actions/github-script@v7
        with:
          script: |
            const action = '${{ steps.parse.outputs.action_type }}';
            let commentBody = "";
            if(action === "add"){
              const skipCheck = '${{ steps.check_site_add.outputs.skip }}';
              const checkMsg = `${{ steps.check_site_add.outputs.msg }}`;
              const skipProcess = '${{ steps.process_add.outputs.skip }}';
              const processMsg = `${{ steps.process_add.outputs.skip_msg }}`;
              if (skipCheck === "true") {
                commentBody = `❌ 友链申请失败：${checkMsg}`;
              } else if (skipProcess === "true") {
                commentBody = `❌ 友链申请失败：${processMsg}`;
              } else {
                commentBody = "🎉 友链校验通过，已成功录入！页面一般2分钟左右生效，感谢友链交换~";
              }
            }else if(action === "delete"){
              const skipProcess = '${{ steps.process_del.outputs.skip }}';
              const processMsg = `${{ steps.process_del.outputs.skip_msg }}`;
              if(skipProcess === "true"){
                commentBody = `❌ 删除友链失败：${processMsg}`;
              }else{
                commentBody = "✅ 友链已成功移除，页面稍后同步更新！";
              }
            }else if(action === "edit"){
              const skipProcess = '${{ steps.process_edit.outputs.skip }}';
              const processMsg = `${{ steps.process_edit.outputs.skip_msg }}`;
              if(skipProcess === "true"){
                commentBody = `❌ 修改友链失败：${processMsg}`;
              }else{
                commentBody = "✅ 友链信息修改完成，页面稍后同步更新！";
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
