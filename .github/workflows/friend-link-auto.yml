name: 友链自动合并

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

env:
  TARGET_REPO: gongjuecloak/CloakBlog
  TARGET_BRANCH: master
  FRIENDS_FILE: src/friends.json
  HEALTH_FILE: src/friends_health.json

jobs:
  friend-link:
    if: startsWith(github.event.issue.title, '[友链申请]') || startsWith(github.event.issue.title, '[删除友链]')
    runs-on: ubuntu-latest
    steps:
      - name: Python解析Issue表单内容
        id: parse
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          python3 << 'PY'
          import re, os
          body = os.environ["ISSUE_BODY"]
          title = os.environ["ISSUE_TITLE"]
          action_type = "add"
          if title.startswith("[删除友链]"):
              action_type = "delete"
          print(f"====DEBUG==== action_type={action_type}")

          def get_val(label: str):
              pat = re.compile(rf'### {re.escape(label)}\s*\n+(.*?)(?=\n### |\Z)', re.S)
              m = pat.search(body)
              val = ""
              if m:
                  val = m.group(1).strip()
              print(f"====DEBUG==== [{label}] => `{val}`")
              return val

          if action_type == "add":
              name = get_val("博客名称")
              url = get_val("博客地址")
              avatar = get_val("头像地址")
              desc = get_val("博客描述")
          else:
              name = ""
              url = get_val("需要删除的博客地址（完整URL）")
              avatar = ""
              desc = ""

          def out(key, val):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf8") as f:
                  f.write(f"{key}<<EOFV\n{val}\nEOFV\n")

          out("action_type", action_type)
          out("name", name)
          out("url", url)
          out("avatar", avatar)
          out("desc", desc)
          PY

      # ====================== 新增友链流程 ======================
      - name: 【新增】校验基础字段 + 探测对方网站连通性
        id: check_site_add
        if: steps.parse.outputs.action_type == 'add'
        env:
          URL: ${{ steps.parse.outputs.url }}
          NAME: ${{ steps.parse.outputs.name }}
        run: |
          skip="false"
          msg=""
          if [[ -z "$NAME" || -z "$URL" ]]; then
            skip="true"
            msg="缺少【博客名称/博客地址】，表单信息不全"
          elif [[ ! "$URL" =~ ^https?:// ]]; then
            skip="true"
            msg="博客地址必须以 http:// 或 https:// 开头"
          else
            echo "正在检测站点: $URL"
            HTTP_CODE=$(curl -L -A "GithubActions Bot/1.0" -m 10 -s -o /dev/null -w "%{http_code}" "$URL")
            if [[ "$HTTP_CODE" != "200" ]]; then
              skip="true"
              msg="站点访问检测失败，HTTP状态码：$HTTP_CODE，请确保网站可正常访问后重新申请"
            fi
          fi
          echo "skip=$skip" >> $GITHUB_OUTPUT
          echo "msg<<EOFV" >> $GITHUB_OUTPUT
          echo "$msg" >> $GITHUB_OUTPUT
          echo "EOFV" >> $GITHUB_OUTPUT

      - name: 检出 CloakBlog 仓库
        if: >
          (steps.parse.outputs.action_type == 'add' && steps.check_site_add.outputs.skip == 'false')
          || steps.parse.outputs.action_type == 'delete'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.PERSONAL_TOKEN }}
          path: CloakBlog
          ref: ${{ env.TARGET_BRANCH }}

      - name: 【新增】写入友链JSON（查重+追加）
        id: process_add
        if: steps.parse.outputs.action_type == 'add' && steps.check_site_add.outputs.skip == 'false'
        env:
          NAME: ${{ steps.parse.outputs.name }}
          URL: ${{ steps.parse.outputs.url }}
          AVATAR: ${{ steps.parse.outputs.avatar }}
          DESC: ${{ steps.parse.outputs.desc }}
          WORK_PATH: CloakBlog
        run: |
          python3 << 'PYEOF'
          import json, os
          work_dir = os.environ["WORK_PATH"]
          friends_path = os.path.join(work_dir, os.environ["FRIENDS_FILE"])
          health_path = os.path.join(work_dir, os.environ["HEALTH_FILE"])

          name = os.environ.get("NAME", "").strip()
          url = os.environ.get("URL", "").strip()
          avatar = os.environ.get("AVATAR", "").strip()
          desc = os.environ.get("DESC", "").strip()
          skip = False
          skip_msg = ""

          try:
              with open(friends_path, "r", encoding="utf-8") as f:
                  friends = json.load(f)
          except Exception:
              friends = []
          exist_urls = [item.get("url", "").strip() for item in friends]
          if url in exist_urls:
              skip = True
              skip_msg = f"URL {url} 已存在，请勿重复申请友链"
          else:
              friends.append({"name": name, "url": url, "avatar": avatar, "desc": desc})
              with open(friends_path, "w", encoding="utf-8") as f:
                  json.dump(friends, f, ensure_ascii=False, indent=2)
                  f.write("\n")
              try:
                  with open(health_path, "r", encoding="utf-8") as f:
                      health = json.load(f)
              except Exception:
                  health = {}
              health[url] = True
              with open(health_path, "w", encoding="utf-8") as f:
                  json.dump(health, f, ensure_ascii=False, indent=2)
                  f.write("\n")

          output = os.environ["GITHUB_OUTPUT"]
          with open(output, "a", encoding="utf-8") as out:
              out.write(f"skip={skip}\n")
              if skip:
                  out.write(f"skip_msg<<EOFV\n{skip_msg}\nEOFV\n")
          PYEOF

      # ====================== 删除友链流程【重点修复】 ======================
      - name: 【删除】执行移除URL
        id: process_del
        if: steps.parse.outputs.action_type == 'delete'
        env:
          DEL\_URL\_RAW: ${{ steps.parse.outputs.url }}
          WORK\_PATH: CloakBlog
        run: |
          python3 << 'PYEOF'
          import json, os
          work\_dir = os.environ\["WORK\_PATH"\]
          friends\_path = os.path.join(work\_dir, os.environ\["FRIENDS\_FILE"\])
          health\_path = os.path.join(work\_dir, os.environ\["HEALTH\_FILE"\])
          del\_url\_input = os.environ\["DEL\_URL\_RAW"\].strip()
          print(f"====DELETE DEBUG=== 待删除URL输入: \`{del\_url\_input}\`")

          # URL标准化函数：去除末尾斜杠、小写协议用于比对
          def normalize\_url(u: str):
              u = u.strip()
              # 移除结尾多余/
              while u.endswith("/"):
                  u = u\[:-1\]
              # http<->https统一转换为https比对
              if u.startswith("http://"):
                  u = "https://" + u\[7:\]
              return u

          target\_norm = normalize\_url(del\_url\_input)
          print(f"标准化比对字符串: \`{target\_norm}\`")
          skip = False
          skip\_msg = ""

          try:
              with open(friends\_path, "r", encoding="utf-8") as f:
                  friends = json.load(f)
          except Exception as e:
              print("读取friends.json异常:", e)
              friends = \[\]

          old\_len = len(friends)
          friends\_filtered = \[\]
          match\_item = None
          for item in friends:
              item\_url = item.get("url", "").strip()
              item\_norm = normalize\_url(item\_url)
              if item\_norm != target\_norm:
                  friends\_filtered.append(item)
              else:
                  match\_item = item
                  print(f"✅ 匹配成功，原始库内URL：\`{item\_url}\`")

          friends = friends\_filtered
          print(f"原友链数量:{old\_len} 过滤后:{len(friends)}")

          if len(friends) == old\_len:
              skip = True
              skip\_msg = f"未匹配到友链地址：{del\_url\_input}（请核对完整URL，注意斜杠、http/https）"
          else:
              # 写入friends.json
              with open(friends\_path, "w", encoding="utf-8") as f:
                  json.dump(friends, f, ensure\_ascii=False, indent=2)
                  f.write("\\n")
              print("✅ friends.json 已重写")
              # 处理健康文件：注意health是原始URL作为key，不能用标准化值！
              if match\_item and "url" in match\_item:
                  origin\_key = match\_item\["url"\]
                  try:
                      with open(health\_path, "r", encoding="utf-8") as f:
                          health = json.load(f)
                  except Exception:
                      health = {}
                  if origin\_key in health:
                      del health\[origin\_key\]
                      with open(health\_path, "w", encoding="utf-8") as f:
                          json.dump(health, f, ensure\_ascii=False, indent=2)
                          f.write("\\n")
                      print(f"✅ friends\_health.json 删除原始key: {origin\_key}")

          output = os.environ\["GITHUB\_OUTPUT"\]
          with open(output, "a", encoding="utf-8") as out:
              out.write(f"skip={skip}\\n")
              if skip:
                  out.write(f"skip\_msg<<EOFV\\n{skip\_msg}\\nEOFV\\n")
          PYEOF

      # ====================== 统一提交【增加git调试日志】 ======================
      - name: 提交推送 CloakBlog
        if: >
          (steps.parse.outputs.action_type == 'add' && steps.check_site_add.outputs.skip == 'false' && steps.process_add.outputs.skip == 'false')
          || (steps.parse.outputs.action_type == 'delete' && steps.process_del.outputs.skip == 'false')
        env:
          ACTION_TYPE: ${{ steps.parse.outputs.action_type }}
          TARGET_URL: ${{ steps.parse.outputs.url }}
          TARGET_NAME: ${{ steps.parse.outputs.name }}
        run: |
          cd CloakBlog
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.FRIENDS_FILE }} ${{ env.HEALTH_FILE }}

          echo "====git diff 变更预览===="
          git diff --cached
          echo "========================"

          if git diff --cached --quiet; then
            echo "⚠️ 无文件变更，跳过提交"
            exit 0
          fi
          if [[ "$ACTION_TYPE" == "add" ]];then
            git commit -m "feat: 新增友链 - $TARGET_NAME"
          else
            git commit -m "chore: 删除友链 - $TARGET_URL"
          fi
          git push origin ${{ env.TARGET_BRANCH }}
          echo "✅ git push 执行完毕"

      # ====================== 统一评论并关闭Issue ======================
      - name: Issue 评论 + 关闭
        uses: actions/github-script@v7
        with:
          script: |
            const action = '${{ steps.parse.outputs.action_type }}';
            let commentBody = "";
            if(action === "add"){
              const skipCheck = '${{ steps.check_site_add.outputs.skip }}';
              const checkMsg = `${{ steps.check_site_add.outputs.msg }}`;
              const skipProcess = '${{ steps.process_add.outputs.skip }}';
              const processMsg = `${{ steps.process_add.outputs.skip_msg }}`;
              if (skipCheck === "true") {
                commentBody = `❌ 友链申请失败：${checkMsg}`;
              } else if (skipProcess === "true") {
                commentBody = `❌ 友链申请失败：${processMsg}`;
              } else {
                commentBody = "🎉 友链校验通过，已成功录入！页面一般2分钟左右生效，感谢友链交换~";
              }
            }else{
              const skipProcess = '${{ steps.process_del.outputs.skip }}';
              const processMsg = `${{ steps.process_del.outputs.skip_msg }}`;
              if(skipProcess === "true"){
                commentBody = `❌ 删除友链失败：${processMsg}`;
              }else{
                commentBody = "✅ 友链已成功移除，页面稍后同步更新！";
              }
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
