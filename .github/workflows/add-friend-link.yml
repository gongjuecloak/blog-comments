name: 友链自动合并

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

env:
  TARGET_REPO: gongjuecloak/CloakBlog
  TARGET_BRANCH: master
  FRIENDS_FILE: src/friends.json
  HEALTH_FILE: src/friends_health.json

jobs:
  friend-link:
    if: contains(github.event.issue.labels.*.name, '友链')
    runs-on: ubuntu-latest
    steps:
      - name: 解析表单友链信息【适配Issue Form】
        id: parse
        run: |
          BODY="${{ github.event.issue.body }}"
          # 提取 ### xxx 下方内容
          parse_field() {
            field="$1"
            echo "$BODY" | awk -v key="$field" '
              $0 ~ "^### " key {flag=1; next}
              flag && NF>0 {print; exit}
              flag && NF==0 {exit}
            ' | sed -e 's/^[ \t]*//' -e 's/[ \t]*$//'
          }
          NAME=$(parse_field "博客名称")
          URL=$(parse_field "博客地址")
          AVATAR=$(parse_field "头像地址")
          DESC=$(parse_field "博客描述")

          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "avatar=$AVATAR" >> $GITHUB_OUTPUT
          echo "desc=$DESC" >> $GITHUB_OUTPUT

      - name: 校验基础字段 + 探测对方网站连通性
        id: check_site
        env:
          URL: ${{ steps.parse.outputs.url }}
          NAME: ${{ steps.parse.outputs.name }}
        run: |
          skip="false"
          msg=""
          if [[ -z "$NAME" || -z "$URL" ]]; then
            skip="true"
            msg="缺少【博客名称/博客地址】，表单信息不全"
          elif [[ ! "$URL" =~ ^https?:// ]]; then
            skip="true"
            msg="博客地址必须以 http:// 或 https:// 开头"
          else
            echo "正在检测站点: $URL"
            HTTP_CODE=$(curl -L -A "GithubActions Bot/1.0" -m 10 -s -o /dev/null -w "%{http_code}" "$URL")
            if [[ "$HTTP_CODE" != "200" ]]; then
              skip="true"
              msg="站点访问检测失败，HTTP状态码：$HTTP_CODE，请确保网站可正常访问后重新申请"
            fi
          fi
          echo "skip=$skip" >> $GITHUB_OUTPUT
          echo "msg=$msg" >> $GITHUB_OUTPUT

      - name: 检出 CloakBlog 仓库
        if: steps.check_site.outputs.skip == 'false'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.TARGET_REPO }}
          token: ${{ secrets.PERSONAL_TOKEN }}
          path: CloakBlog
          ref: ${{ env.TARGET_BRANCH }}

      - name: 写入友链JSON（查重+追加）
        id: process_link
        if: steps.check_site.outputs.skip == 'false'
        env:
          NAME: ${{ steps.parse.outputs.name }}
          URL: ${{ steps.parse.outputs.url }}
          AVATAR: ${{ steps.parse.outputs.avatar }}
          DESC: ${{ steps.parse.outputs.desc }}
          WORK_PATH: CloakBlog
        run: |
          python3 << 'PYEOF'
          import json
          import os
          import sys

          work_dir = os.environ["WORK_PATH"]
          friends_path = os.path.join(work_dir, os.environ["FRIENDS_FILE"])
          health_path = os.path.join(work_dir, os.environ["HEALTH_FILE"])

          name = os.environ.get("NAME", "").strip()
          url = os.environ.get("URL", "").strip()
          avatar = os.environ.get("AVATAR", "").strip()
          desc = os.environ.get("DESC", "").strip()

          skip = False
          skip_msg = ""

          try:
              with open(friends_path, "r", encoding="utf-8") as f:
                  friends = json.load(f)
          except Exception:
              friends = []

          exist_urls = [item.get("url", "") for item in friends]
          if url in exist_urls:
              skip = True
              skip_msg = f"URL {url} 已存在，请勿重复申请友链"
          else:
              friends.append({
                  "name": name,
                  "url": url,
                  "avatar": avatar,
                  "desc": desc
              })
              with open(friends_path, "w", encoding="utf-8") as f:
                  json.dump(friends, f, ensure_ascii=False, indent=2)
                  f.write("\n")
              try:
                  with open(health_path, "r", encoding="utf-8") as f:
                      health = json.load(f)
              except Exception:
                  health = {}
              health[url] = True
              with open(health_path, "w", encoding="utf-8") as f:
                  json.dump(health, f, ensure_ascii=False, indent=2)
                  f.write("\n")

          print(f"skip={skip}" >> os.environ["GITHUB_OUTPUT"])
          if skip:
              print(f"skip_msg={skip_msg}" >> os.environ["GITHUB_OUTPUT"])
              sys.exit(0)
          print("success=true" >> os.environ["GITHUB_OUTPUT"])
          PYEOF

      - name: 提交推送 CloakBlog
        if: steps.check_site.outputs.skip == 'false' && steps.process_link.outputs.skip == 'false'
        run: |
          cd CloakBlog
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.FRIENDS_FILE }} ${{ env.HEALTH_FILE }}
          if git diff --cached --quiet; then
            echo "无文件变更，跳过提交"
            exit 0
          fi
          git commit -m "feat: 新增友链 - ${{ steps.parse.outputs.name }}"
          git push origin ${{ env.TARGET_BRANCH }}

      - name: Issue 评论 + 关闭
        uses: actions/github-script@v7
        with:
          script: |
            const skipCheck = '${{ steps.check_site.outputs.skip }}';
            const checkMsg = '${{ steps.check_site.outputs.msg }}';
            const skipProcess = '${{ steps.process_link.outputs.skip }}';
            const processMsg = '${{ steps.process_link.outputs.skip_msg }}';

            let commentBody = "";
            if (skipCheck === "true") {
              commentBody = `❌ 友链申请失败：${checkMsg}`;
            } else if (skipProcess === "true") {
              commentBody = `❌ 友链申请失败：${processMsg}`;
            } else {
              commentBody = "🎉 友链校验通过，已成功录入！页面一般2分钟左右生效，感谢友链交换~";
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: commentBody
            });

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              state: "closed"
            });
