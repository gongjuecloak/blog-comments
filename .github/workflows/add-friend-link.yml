name: 自动添加友链
on:
  issues:
    types: [closed]

jobs:
  add-friend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 解析并添加友链
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = context.payload.issue.body;
            
            // 解析内容
            const name = body.match(/名称.*[:：]\s*(.+)/m)?.[1]?.trim();
            const url = body.match(/地址.*[:：]\s*(.+)/m)?.[1]?.trim();
            const avatar = body.match(/头像.*[:：]\s*(.+)/m)?.[1]?.trim();
            const desc = body.match(/描述.*[:：]\s*(.+)/m)?.[1]?.trim();
            
            if (!name || !url) return;
            
            // ✅ 如果文件不存在，先创建空数组
            let data = [];
            if (fs.existsSync('friends.json')) {
              data = JSON.parse(fs.readFileSync('friends.json', 'utf8'));
            }
            
            // 添加新友链
            data.push({ 
              name, 
              url, 
              avatar: avatar || 'https://picsum.photos/100/100', 
              desc: desc || '' 
            });
            
            // 写入文件
            fs.writeFileSync('friends.json', JSON.stringify(data, null, 2));
            console.log('已添加友链:', name);

      - name: 提交到当前仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add friends.json
          git commit -m "自动添加友链" || echo "没有变化"
          git push
