name: 自动添加友链
on:
  issues:
    types: [closed]

permissions:
  contents: write

jobs:
  add-friend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main

      - name: 解析并自动提交
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const body = context.payload.issue.body;
            
            // ✅ 改成匹配换行格式的正则
            const name = body.match(/### 博客名称\s*\n\s*(.+)/)?.[1]?.trim();
            const url = body.match(/### 博客地址\s*\n\s*(.+)/)?.[1]?.trim();
            const avatar = body.match(/### 头像地址\s*\n\s*(.+)/)?.[1]?.trim();
            const desc = body.match(/### 博客描述\s*\n\s*(.+)/)?.[1]?.trim();
            
            console.log('解析结果:', {name, url, avatar, desc});
            
            if (!name || !url) {
              console.log('❌ 信息不完整');
              return;
            }
            
            // 读取或创建文件
            let data = [];
            if (fs.existsSync('friends.json')) {
              data = JSON.parse(fs.readFileSync('friends.json', 'utf8'));
            }
            
            data.push({ 
              name, 
              url, 
              avatar: avatar || 'https://picsum.photos/100/100', 
              desc: desc || '' 
            });
            
            fs.writeFileSync('friends.json', JSON.stringify(data, null, 2));
            
            // 提交
            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');
            execSync('git add friends.json');
            execSync('git commit -m "自动添加友链：' + name + '" || true');
            execSync('git push origin main');
            
            console.log('✅ 友链添加成功:', name);
