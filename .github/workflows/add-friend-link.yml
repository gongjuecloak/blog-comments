name: 自动添加友链
on:
  issues:
    types: [closed]

# ✅ 加权限
permissions:
  contents: write

jobs:
  add-friend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main  # ✅ 指定你的分支，main或master

      - name: 解析并自动提交
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { execSync } = require('child_process');
            const body = context.payload.issue.body;
            
            console.log('=== Issue内容 ===');
            console.log(body);
            
            // 解析
            const name = body.match(/名称.*[:：]\s*(.+)/m)?.[1]?.trim();
            const url = body.match(/地址.*[:：]\s*(.+)/m)?.[1]?.trim();
            
            console.log('=== 解析结果 ===');
            console.log({name, url});
            
            if (!name || !url) {
              console.log('❌ 信息不完整，退出');
              return;
            }
            
            const avatar = body.match(/头像.*[:：]\s*(.+)/m)?.[1]?.trim() || 'https://picsum.photos/100/100';
            const desc = body.match(/描述.*[:：]\s*(.+)/m)?.[1]?.trim() || '';
            
            // 读取或创建
            let data = [];
            if (fs.existsSync('friends.json')) {
              data = JSON.parse(fs.readFileSync('friends.json', 'utf8'));
            }
            
            data.push({ name, url, avatar, desc });
            fs.writeFileSync('friends.json', JSON.stringify(data, null, 2));
            
            console.log('✅ 文件内容:', fs.readFileSync('friends.json', 'utf8'));
            
            // 提交
            execSync('git config user.name "github-actions[bot]"');
            execSync('git config user.email "github-actions[bot]@users.noreply.github.com"');
            execSync('git add friends.json');
            execSync('git commit -m "自动添加友链：' + name + '" || true');
            execSync('git push origin main');  // ✅ 指定分支
            
            console.log('✅ 推送成功!');
