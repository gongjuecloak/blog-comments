name: 自动添加友链
on:
  issues:
    types: [closed]

jobs:
  add-friend:
    if: contains(github.event.issue.labels.*.name, '友链')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 解析并添加友链
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = context.payload.issue.body;
            
            // 解析Issue内容
            const name = body.match(/博客名称\s*\n\s*(.+)/)?.[1]?.trim();
            const url = body.match(/博客地址\s*\n\s*(.+)/)?.[1]?.trim();
            const avatar = body.match(/头像地址\s*\n\s*(.+)/)?.[1]?.trim();
            const desc = body.match(/博客描述\s*\n\s*(.+)/)?.[1]?.trim();
            
            if (!name || !url || !avatar || !desc) return;
            
            // 读取并更新friends.json
            const data = JSON.parse(fs.readFileSync('friends.json', 'utf8'));
            data.push({ name, url, avatar, desc });
            fs.writeFileSync('friends.json', JSON.stringify(data, null, 2));

      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add friends.json
          git commit -m "自动添加友链" || exit 0
          git push
