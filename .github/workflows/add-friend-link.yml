name: 自动添加友链
on:
  issues:
    types: [closed]

jobs:
  add-friend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 解析并添加友链
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = context.payload.issue.body;
            console.log('Issue内容:', body);
            
            // 简化解析，只要有关键词就行
            const name = body.match(/名称.*[:：]\s*(.+)/m)?.[1]?.trim();
            const url = body.match(/地址.*[:：]\s*(.+)/m)?.[1]?.trim();
            const avatar = body.match(/头像.*[:：]\s*(.+)/m)?.[1]?.trim();
            const desc = body.match(/描述.*[:：]\s*(.+)/m)?.[1]?.trim();
            
            console.log('解析结果:', {name, url, avatar, desc});
            
            if (name && url) {
              const data = JSON.parse(fs.readFileSync('friends.json', 'utf8'));
              data.push({ name, url, avatar: avatar || '', desc: desc || '' });
              fs.writeFileSync('friends.json', JSON.stringify(data, null, 2));
            }

      - name: 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add friends.json
          git commit -m "自动添加友链" || exit 0
          git push
