name: 友链申请
description: 申请添加友情链接
title: "[友链申请]申请添加友情链接"
labels:
  - 友链
body:
  - type: input
    id: name
    attributes:
      label: 博客名称
      placeholder: 博客名称
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 博客地址
      placeholder: https://example.com
    validations:
      required: true
  - type: input
    id: avatar
    attributes:
      label: 头像地址
      placeholder: https://example.com/avatar.png
    validations:
      required: true
  - type: input
    id: desc
    attributes:
      label: 博客描述
      placeholder: 简短介绍本站内容
    validations:
      required: true
